<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fredoka:wght@500&display=swap"><style>
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:26px}
body{padding:16px}
.serif{font-family:var(--font-serif);font-weight:400}
.mono{font-family:var(--font-mono)}
.lab{font-family:var(--font-mono);font-size:11px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 6px var(--butter-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:0s!important}}
</style><style>.g{display:flex;gap:var(--space-1);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-2)}
.tag{font-family:var(--font-mono);font-size:11px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-tag);border:1px solid transparent}
.kw{font-family:var(--font-mono);font-size:13px;line-height:20px;background:var(--terminal);color:var(--terminal-text);padding:4px 10px;border-radius:var(--radius-tag)}
.pill{font-family:var(--font-mono);font-size:13px;line-height:20px;padding:4px 12px;border-radius:var(--radius-pill)}
.ok{background:var(--mint-soft);color:var(--moss)}.err{background:var(--peach-soft);color:var(--clay)}</style></head><body><div class="g"><span class="tag" style="background:var(--pink-soft);color:var(--rose)">know yourself</span><span class="tag on" style="background:var(--lilac-soft);color:var(--violet);border-color:var(--lilac)">think</span><span class="tag" style="background:var(--peach-soft);color:var(--clay)">build</span><span class="tag" style="background:var(--mint-soft);color:var(--moss)">check</span></div>
<div class="g"><span class="kw">[ LEARN ]</span><span class="kw">[ TAX ]</span><span class="kw">[ SKILL ]</span><span class="pill ok">it ran</span><span class="pill err">❯ try the keyword in lowercase</span></div></body></html>
