<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fredoka:wght@500&display=swap"><style>
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:26px}
body{padding:16px}
.serif{font-family:var(--font-serif);font-weight:400}
.mono{font-family:var(--font-mono)}
.lab{font-family:var(--font-mono);font-size:11px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 6px var(--butter-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:0s!important}}
</style><style>.term{background:var(--terminal);border-radius:var(--radius-terminal);overflow:hidden;max-width:560px;font-family:var(--font-mono);font-size:14px;line-height:22px;color:var(--terminal-text)}
.bar{background:var(--terminal-bar);padding:8px 14px;display:flex;align-items:center;gap:6px;color:var(--terminal-muted);font-size:11px}
.bar i{width:9px;height:9px;border-radius:50%;background:var(--terminal-muted);opacity:.5}.bar span{margin-left:8px}
.out{padding:var(--space-3);display:grid;gap:4px}
.out b{color:var(--butter);font-weight:500}.m{color:var(--terminal-muted)}.kw{color:var(--pink)}
.typed{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;width:14ch;animation:type 1.4s steps(26) both}
.cur{display:inline-block;width:.55em;height:1em;background:var(--pink);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes type{from{width:0}to{width:14ch}}@keyframes blink{50%{opacity:0}}</style></head><body><div class="term"><div class="bar"><i></i><i></i><i></i><span>qendresa.dev</span></div>
